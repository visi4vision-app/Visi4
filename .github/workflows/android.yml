
name: Build APK (Expo EAS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Expo CLI moderne
      - name: Install Expo and EAS CLI
        run: npm install -g expo eas-cli

      # Login Expo avec token GitHub
      - name: Login to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo whoami

      # Config EAS obligatoire sinon erreur appVersionSource
      - name: Configure EAS
        run: npx eas build:configure --non-interactive || true

      # Build APK Android
      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build \
            --platform android \
            --profile apk \
            --non-interactive \
            --clear-cache
